[workspace]
members = [
    "crates/typrest-core",
    "crates/typrest-server",
    "crates/typrest-cli",
]
default-members = ["crates/typrest-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
async-trait = "0.1"
axum = "0.8.9"
bytes = "1"
clap = { version = "4.6.4", features = ["derive"] }
codespan-reporting = "0.13"
futures-executor = "0.3"
notify = "8"
pdf-extract = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }
toml = "0.8.23"
tower = "0.5.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
typst = "=0.15.1"
typst-assets = { version = "=0.15.1", features = ["fonts"] }
typst-pdf = "=0.15.1"
insta = "1"
