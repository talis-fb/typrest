[workspace]
members = [
    "crates/papelon-core",
    "crates/papelon-server",
    "crates/papelon-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
async-trait = "0.1"
bytes = "1"
futures-executor = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
typst = "=0.15.1"
typst-assets = "=0.15.1"
typst-pdf = "=0.15.1"
