# Serves examples/invoice with watch mode on http://127.0.0.1:8080.
#
# The project is bind-mounted read-write because Typrest writes its package cache to
# /project/.typrest. The container runs as uid/gid 1000 by default; if your checkout is owned by a
# different user, run: TYPREST_UID="$(id -u)" TYPREST_GID="$(id -g)" docker compose up
#
# The port is bound to loopback because the Web UI is unauthenticated.
services:
  typrest:
    build: .
    user: "${TYPREST_UID:-1000}:${TYPREST_GID:-1000}"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./examples/invoice:/project
    command: ["typrest", "serve", "--watch"]
    # Must exceed [server].shutdown_timeout_seconds (default 25 s) in the project's typrest.toml.
    stop_grace_period: 30s
