schemaVersion: v1
request:
  body:
    type: object
    properties:
      invoice_number:
        type: string
        required: true
      date:
        type: string
        required: true
      due_date:
        type: string
        required: true
      customer:
        type: object
        required: true
        properties:
          name:
            type: string
            required: true
          email:
            type: string
            required: true
      items:
        type: array
        required: true
        items:
          type: object
          properties:
            description:
              type: string
              required: true
            quantity:
              type: number
              required: true
            unit_price:
              type: string
              required: true
            total:
              type: string
              required: true
      subtotal:
        type: string
        required: true
      tax:
        type: string
        required: true
      total:
        type: string
        required: true
