schemaVersion: v1
request:
  body:
    type: object
    properties:
      title:
        type: string
        required: true
      period:
        type: string
        required: true
      series:
        type: array
        required: true
        items:
          type: object
          properties:
            label:
              type: string
              required: true
            value:
              type: number
              required: true
      unit:
        type: string
        default: ""
