name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TARGET: x86_64-unknown-linux-musl
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Require stable tags to come from main
        run: |
          if [[ "$GITHUB_REF_NAME" != *-* ]]; then
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          fi
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ env.TARGET }}
      - name: Install the musl toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - name: Install cargo-about
        run: cargo install cargo-about --version 0.9.3 --locked --features cli
      - name: Build
        run: cargo build --release --locked --bin typrest --target "$TARGET"
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
      - name: Generate third-party notices
        run: scripts/generate-notices.sh target/THIRD_PARTY_NOTICES.html
      - name: Check the binary is static and matches the tag version
        run: |
          binary="target/$TARGET/release/typrest"
          file "$binary" | grep -E 'statically linked|static-pie linked'
          # A release candidate tag (v0.1.0-rc.1) builds the 0.1.0 package version.
          version="${TAG#v}"
          test "$("$binary" --version)" = "typrest ${version%%-*}"
      - name: Package
        run: |
          name="typrest-${TAG}-x86_64-linux"
          mkdir -p "dist/$name"
          cp "target/$TARGET/release/typrest" LICENSE target/THIRD_PARTY_NOTICES.html "dist/$name/"
          # The tarball holds the files at its root, matching `tar -xzf` + `install typrest`.
          tar -C "dist/$name" -czf "dist/$name.tar.gz" typrest LICENSE THIRD_PARTY_NOTICES.html
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          cat "dist/$name.tar.gz.sha256"
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" --title "$TAG" --generate-notes "${flags[@]}" \
            "dist/typrest-${TAG}-x86_64-linux.tar.gz" \
            "dist/typrest-${TAG}-x86_64-linux.tar.gz.sha256"
